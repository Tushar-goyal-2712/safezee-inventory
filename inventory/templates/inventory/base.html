{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{% block title %}SAFEZEE Inventory{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Bootstrap Icons -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-dark sz-navbar sticky-top">
        <div class="container-fluid px-3 d-flex justify-content-between align-items-center">
            <span class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0">
                <i class="bi bi-fire fs-4"></i>
                SAFEZEE <span class="fw-light">Inventory</span>
            </span>
            {% if request.session.sz_authenticated %}
            <form method="post" action="{% url 'accounts:logout' %}" class="mb-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm sz-btn-logout">
                    <i class="bi bi-box-arrow-right me-1"></i> Sign out
                </button>
            </form>
            {% endif %}
        </div>
    </nav>

    <main class="container-fluid px-3 px-md-4 py-3 pb-5">
        {% block content %}{% endblock %}
    </main>

    <div
        id="sz-toast-container"
        class="toast-container position-fixed bottom-0 end-0 p-3"
        style="z-index: 1080;"
    ></div>

    <!-- Bootstrap 5 JS bundle (needed for modals/toasts) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

    {% block extra_body %}{% endblock %}
</body>
</html>
